; PlatformIO Project Configuration File
;
; Custom Bruce 1.16.1 build target for ESP32-S3-DevKitC-1 N16R8 + SSD1306

[env:esp32-s3-devkitc-1-psram]
extends = env:esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
build_flags =
	${env:esp32-s3-devkitc-1.build_flags}
	-D BOARD_HAS_PSRAM=1

[env:esp32-s3-devkitc-1]
board = ESP-General
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-Iboards/ESP-General
	-DUSB_as_HID=1

	; Keep SSD1306 I2C on the known-working GPIO8/GPIO9 pair.
	; Move the generic Grove/RF aliases away from those pins.
	-DGROVE_SDA=4
	-DGROVE_SCL=5

	; IR LED pin / RF one-wire aliases
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DTXLED=40
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'

	; SD card disabled for the bare DevKit profile
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; SSD1306 display control. Detailed LovyanGFX I2C geometry is in pins_arduino.h.
	; Rotate the UI 180 degrees so it is upright with the VCC/GND/SCL/SDA header at the top.
	-DROTATION=2
	-DBACKLIGHT=-1
	-DMINBRIGHT=160
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0xAF
	-DTFT_DISPOFF=0xAE
	-DTFT_CS=-1
	-DTFT_DC=-1
	-DTFT_RST=-1
	-DTOUCH_CS=-1
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_BL=-1
	-DFP=1
	-DFM=1
	-DFG=1
	-DBTN_ALIAS='"OK"'

	; Optional peripherals
	-DFM_RSTPIN=12

	; CC1101 is intentionally disabled in this OLED build because its generic
	; GDO0 default is GPIO9, which is now SSD1306 SCL.
	;-DUSE_CC1101_VIA_SPI
	;-DCC1101_GDO0_PIN=9
	;-DCC1101_SS_PIN=10
	;-DCC1101_MOSI_PIN=11
	;-DCC1101_SCK_PIN=12
	;-DCC1101_MISO_PIN=13

	;-DUSE_NRF24_VIA_SPI
	;-DNRF24_CE_PIN=6
	;-DNRF24_SS_PIN=7
	;-DNRF24_MOSI_PIN=11
	;-DNRF24_SCK_PIN=12
	;-DNRF24_MISO_PIN=13

	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10

	-DDEVICE_NAME='"ESP32-S3 DevkitC SSD1306 MONO ROT180"'

lib_deps =
	${env.lib_deps}
	https://github.com/lovyan03/LovyanGFX#develop

extra_scripts =
	${env.extra_scripts}
	pre:patch_lovyan_i2c.py
	pre:patch_ssd1306_monochrome.py
