; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32-s3-devkitc-1-psram]
board_build.arduino.memory_type = qio_opi  ; NEEDED FOR 8MB PSRAM (N16R8)
;board_build.partitions = custom_16Mb.csv
;board_upload.flash_size = 16MB
;monitor_speed = 115200
;board_build.partitions = custom_16Mb.csv
;board_build.f_flash = 40000000L
;board_upload.flash_size = 16MB
;board_upload.maximum_size = 16777216
;board_build.f_flash = 40000000L
;board_build.flash_mode = qio
extends                 = env:esp32-s3-devkitc-1
build_flags =
	${env:esp32-s3-devkitc-1.build_flags}
	-D BOARD_HAS_PSRAM=1


[env:esp32-s3-devkitc-1]
board = ESP-General
board_build.partitions = custom_8Mb.csv
; This custom profile is for ESP32-S3-DevKitC-1 N16R8 + 128x64 SSD1306.
; PR_check builds this base env, so enable the N16R8 PSRAM mode here too.
board_build.arduino.memory_type = qio_opi
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-Iboards/ESP-General
	-DUSB_as_HID=1
	-D BOARD_HAS_PSRAM=1
	; Keep the OLED I2C bus free on GPIO8/9. Grove/1-wire RF defaults moved away.
	-DGROVE_SDA=4
	-DGROVE_SCL=5

	; ir led pin
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DTXLED=40
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'

	; sd card pins
	; suggested https://github.com/espressif/esp-idf/tree/master/examples/storage/sd_card/sdmmc
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; Display vars. Detailed SSD1306/Lovyan config lives in pins_arduino.h.
	-DROTATION=0
	-DBACKLIGHT=-1
	-DMINBRIGHT=160
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0xAF
	-DTFT_DISPOFF=0xAE
	-DTFT_CS=-1
	-DTFT_DC=-1
	-DTFT_RST=-1
	-DTOUCH_CS=-1
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_BL=-1
	; Small 128x64 OLED text sizes
	-DFP=1
	-DFM=1
	-DFG=1
	; ui control buttons
	;-DSEL_BTN=1
	;-DUP_BTN=2  ; also work as ESC
	;-DDW_BTN=3  ; also work as NEXT
	-DBTN_ALIAS='"OK"'

	;FM Radio
	;-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713
	-DFM_RSTPIN=12
	;Microphone
	;-DMIC_SPM1423=1 ; uncomment to enable Applicable for SPM1423 device
	;-DPIN_CLK=-1
	;-DI2S_SCLK_PIN=-1
	;-DI2S_DATA_PIN=-1
	;-DPIN_DATA=-1

	; CC1101 disabled in this OLED build because GPIO9 is SSD1306 SCL.
	;-DUSE_CC1101_VIA_SPI
	;-DCC1101_GDO0_PIN=9
	;-DCC1101_SS_PIN=10
	;-DCC1101_MOSI_PIN=11
	;-DCC1101_SCK_PIN=12
	;-DCC1101_MISO_PIN=13
	;-DCC1101_GDO2_PIN=14

	; connections are the same as CC1101
	;-DUSE_NRF24_VIA_SPI
	;-DNRF24_CE_PIN=6
	;-DNRF24_SS_PIN=7  ; chip select
	;-DNRF24_MOSI_PIN=11
	;-DNRF24_SCK_PIN=12
	;-DNRF24_MISO_PIN=13

	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10

	; connections are the same as W5500
	; -DUSE_W5500_VIA_SPI
	; -DW5500_SS_PIN=SPI_SS_PIN
	; -DW5500_MOSI_PIN=SPI_MOSI_PIN
	; -DW5500_SCK_PIN=SPI_SCK_PIN
	; -DW5500_MISO_PIN=SPI_MISO_PIN
	;-DW5500_INT_PIN=6
	-DDEVICE_NAME='"ESP32-S3 DevkitC SSD1306"'

lib_deps =
	${env.lib_deps}
	https://github.com/lovyan03/LovyanGFX#develop

extra_scripts =
	${env.extra_scripts}
	pre:patch_lovyan_i2c.py
