---
name: Build SSD1306 Bruce 1.16.1

concurrency:
  group: ssd1306-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.yml"
      - "**.h"
      - "**.cpp"
      - "**.py"
      - "**.ini"
      - "**.csv"
  workflow_dispatch:

jobs:
  compile_ssd1306:
    name: ESP32-S3 N16R8 + SSD1306
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          pip install platformio requests esptool intelhex

      - name: Stamp build version
        run: |
          version="1.16.1-ssd1306-${GITHUB_SHA::7}"
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini
          sed -i "s/-DGIT_COMMIT_HASH='\"Homebrew\"'/\!echo '-DGIT_COMMIT_HASH=\\\\\\\\\"'\$\(git describe --always --dirty)'\\\\\\\\\"'/g" ./platformio.ini

      - name: Compile N16R8 SSD1306 firmware
        run: platformio run -e esp32-s3-devkitc-1-psram

      - name: Show generated binaries
        run: find . -maxdepth 3 -type f -name '*.bin' -print

      - name: Upload flashable Bruce binary
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-1.16.1-ESP32S3-N16R8-SSD1306
          path: Bruce-*.bin
          retention-days: 5
          if-no-files-found: error
